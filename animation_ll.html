<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LL Memory Allocation Animation</title>
    <style>
        body {
            background-color: #0a0a0a; color: #39ff14; font-family: 'Cascadia Code', Consolas, monospace; overflow: hidden; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh;
        }
        .container { position: relative; width: 100%; max-width: 650px; height: 100%; min-height: 400px; }
        .header-panel { position: absolute; top: 15px; right: 15px; display: flex; gap: 10px; z-index: 20; }
        button { background: rgba(0, 0, 0, 0.8); color: #39ff14; border: 1px solid #00aa00; padding: 8px 16px; cursor: pointer; font-family: inherit; font-weight: bold; border-radius: 4px; transition: all 0.2s; }
        button:hover { background: #39ff14; color: #000; }
        .caption { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); font-size: 0.95rem; color: #e0e0e0; background: rgba(10, 10, 10, 0.95); padding: 12px 20px; border: 1px solid #003300; border-radius: 4px; border-top: 4px solid #39ff14; display: none; width: 90%; max-width: 500px; text-align: center; line-height: 1.5; box-shadow: 0 -4px 15px rgba(0,0,0,0.8); z-index: 20; }
        .math-highlight { color: #ff9d00; font-weight: bold; }
        
        svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        line { stroke: #005500; stroke-width: 2; opacity: 0; transition: opacity 0.5s; stroke-dasharray: 5,5; }
        line.active-edge { stroke: #ff9d00; opacity: 1; filter: drop-shadow(0 0 5px #ff9d00); }

        .memory-block {
            position: absolute; display: flex; flex-direction: column; align-items: center; opacity: 0; transform: scale(0.5); transition: opacity 0.8s, transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 10;
        }
        .memory-block.visible { opacity: 1; transform: scale(1); }
        .node-visual { display: flex; border: 1px solid #39ff14; background: #050505; }
        .ptr { width: 30px; height: 30px; border: 1px solid #005500; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; color: #555; }
        .data { width: 40px; height: 30px; border: 1px solid #39ff14; display: flex; align-items: center; justify-content: center; font-weight: bold; background: #112211; }
        .mem-address { font-size: 0.7rem; color: #ff9d00; margin-bottom: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-panel">
            <button id="pause-btn" onclick="togglePause()" style="display: none;">⏸ Pause</button>
            <button id="start-btn" onclick="runAnimation()">▶ Start</button>
        </div>
        <div class="caption" id="caption"></div>
        
        <svg>
            <line x1="28%" y1="95" x2="15%" y2="150" id="e1"/>
            <line x1="38%" y1="95" x2="65%" y2="200" id="e2"/>
            <line x1="60%" y1="230" x2="45%" y2="280" id="e3"/>
        </svg>

        <!-- Scattered Memory Blocks -->
        <div class="memory-block" id="n0" style="left: 25%; top: 50px;">
            <div class="mem-address">0x200 (Root)</div>
            <div class="node-visual"><div class="ptr">L</div><div class="data">10</div><div class="ptr">R</div></div>
        </div>
        <div class="memory-block" id="n1" style="left: 10%; top: 150px;">
            <div class="mem-address">0x400</div>
            <div class="node-visual"><div class="ptr">L</div><div class="data">20</div><div class="ptr">R</div></div>
        </div>
        <div class="memory-block" id="n2" style="left: 60%; top: 200px;">
            <div class="mem-address">0x300</div>
            <div class="node-visual"><div class="ptr">L</div><div class="data">30</div><div class="ptr">R</div></div>
        </div>
        <div class="memory-block" id="n3" style="left: 40%; top: 280px;">
            <div class="mem-address">0x280</div>
            <div class="node-visual"><div class="ptr">NULL</div><div class="data">50</div><div class="ptr">NULL</div></div>
        </div>
    </div>

    <script>
        const steps = [
            { id: 0, edge: null, text: "<span class='math-highlight'>malloc()</span> dynamically allocates memory for Root at random address 0x200." },
            { id: 1, edge: "e1", text: "Root->left triggers <span class='math-highlight'>malloc()</span>. Node 20 is created at scattered address 0x400. Pointer links them." },
            { id: 2, edge: "e2", text: "Root->right allocates Node 30 at 0x300. Notice how physical memory is scattered, unlike arrays!" },
            { id: 3, edge: "e3", text: "Node 50 is created. Leaf nodes point to <span class='math-highlight'>NULL</span> to prevent garbage data access." }
        ];
        
        let isPaused = false;
        const delay = ms => new Promise(res => setTimeout(res, ms));

        function togglePause() {
            isPaused = !isPaused;
            const pauseBtn = document.getElementById('pause-btn');
            if (isPaused) {
                pauseBtn.innerText = "▶ Resume";
                pauseBtn.style.borderColor = "#ff9d00";
                pauseBtn.style.color = "#ff9d00";
            } else {
                pauseBtn.innerText = "⏸ Pause";
                pauseBtn.style.borderColor = "#00aa00";
                pauseBtn.style.color = "#39ff14";
            }
        }

        async function checkPause() { while (isPaused) await delay(100); }

        async function runAnimation() {
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('pause-btn').style.display = 'block';
            document.getElementById('caption').style.display = 'block';

            for (let i = 0; i < steps.length; i++) {
                await checkPause();
                document.getElementById('caption').innerHTML = steps[i].text;
                document.getElementById('n' + steps[i].id).classList.add('visible');
                
                if (steps[i].edge) {
                    await delay(600);
                    await checkPause();
                    document.getElementById(steps[i].edge).classList.add('active-edge');
                }
                await delay(1500);
            }
            document.getElementById('pause-btn').style.display = 'none';
            document.getElementById('start-btn').style.display = 'block';
            document.getElementById('start-btn').innerText = "↻ Replay";
            document.getElementById('start-btn').onclick = () => location.reload();
        }
    </script>
</body>
</html>
