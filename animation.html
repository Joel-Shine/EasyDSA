<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Tree Collapse Animation</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #39ff14;
            font-family: 'Cascadia Code', Consolas, monospace;
            overflow: hidden;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        
        .container {
            position: relative;
            width: 100%;
            max-width: 650px;
            height: 100%;
            min-height: 400px;
        }

        /* Top Bar: Buttons */
        .header-panel {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 10px;
            z-index: 20;
        }

        button {
            background: rgba(0, 0, 0, 0.8);
            color: #39ff14;
            border: 1px solid #00aa00;
            padding: 8px 16px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            border-radius: 4px;
            transition: all 0.2s;
        }
        button:hover:not(:disabled) {
            background: #39ff14;
            color: #000;
        }
        button:disabled {
            color: #003300;
            border-color: #003300;
            cursor: not-allowed;
        }

        /* Bottom Center Caption */
        .caption {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.95rem;
            color: #e0e0e0;
            background: rgba(10, 10, 10, 0.95);
            padding: 12px 20px;
            border: 1px solid #003300;
            border-radius: 4px;
            border-top: 4px solid #39ff14;
            display: none;
            width: 90%;
            max-width: 500px;
            text-align: center;
            line-height: 1.5;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.8);
            z-index: 20;
        }
        
        .math-highlight { color: #ff9d00; font-weight: bold; font-size: 1.05rem; }

        /* SVG Edges */
        svg { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 1; 
        }
        line { 
            stroke: #005500; 
            stroke-width: 3; 
            transition: stroke 0.3s, opacity 0.5s ease-out; 
        }
        line.active-edge {
            stroke: #ff9d00;
            filter: drop-shadow(0 0 5px #ff9d00);
        }

        /* Tree Nodes */
        .node {
            position: absolute;
            width: 36px;
            height: 36px;
            border: 2px solid #39ff14;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            background: #000;
            transition: transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.3s, border-color 0.3s, color 0.3s;
            z-index: 10;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.1);
        }
        .node.highlight { 
            background-color: #1a1a00; 
            border-color: #ff9d00; 
            color: #ff9d00; 
            box-shadow: 0 0 15px rgba(255, 157, 0, 0.4);
        }
        .node.settled {
            border-color: #00aa00;
            color: #00aa00;
            box-shadow: none;
        }

        /* 1D Array Destination */
        .array-container {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            justify-content: center;
        }
        .array-slot {
            width: clamp(30px, 8vw, 40px);
            height: clamp(30px, 8vw, 40px);
            border: 1px dashed #005500;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #050505;
            transition: background-color 0.5s;
        }
        .array-slot.filled {
            background: #0a140a;
            border-style: solid;
            border-color: #00aa00;
        }
        .array-index {
            position: absolute;
            bottom: -22px;
            font-size: 0.8rem;
            color: #00aa00;
            font-weight: bold;
        }

        /* Responsive Tree Adjustments */
        @media (max-width: 500px) {
            .node { width: 30px; height: 30px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        
        <div class="header-panel">
            <button id="pause-btn" onclick="togglePause()" style="display: none;">⏸ Pause</button>
            <button id="start-btn" onclick="runAnimation()">▶ Start</button>
        </div>
        
        <div class="caption" id="caption"></div>
        
        <!-- Edges -->
        <svg>
            <line x1="50%" y1="50" x2="30%" y2="120" id="e1"/>
            <line x1="50%" y1="50" x2="70%" y2="120" id="e2"/>
            <line x1="30%" y1="120" x2="18%" y2="190" id="e3"/>
            <line x1="30%" y1="120" x2="42%" y2="190" id="e4"/>
            <line x1="70%" y1="120" x2="58%" y2="190" id="e5"/>
            <line x1="70%" y1="120" x2="82%" y2="190" id="e6"/>
        </svg>

        <!-- Initial Tree Nodes -->
        <div class="node" id="n0" style="left: calc(50% - 18px); top: 32px;">A</div>
        <div class="node" id="n1" style="left: calc(30% - 18px); top: 102px;">B</div>
        <div class="node" id="n2" style="left: calc(70% - 18px); top: 102px;">C</div>
        <div class="node" id="n3" style="left: calc(18% - 18px); top: 172px;">D</div>
        <div class="node" id="n4" style="left: calc(42% - 18px); top: 172px;">E</div>
        <div class="node" id="n5" style="left: calc(58% - 18px); top: 172px;">F</div>
        <div class="node" id="n6" style="left: calc(82% - 18px); top: 172px;">G</div>

        <!-- 1D Array Destination -->
        <div class="array-container">
            <div class="array-slot" id="slot0"><div class="array-index">0</div></div>
            <div class="array-slot" id="slot1"><div class="array-index">1</div></div>
            <div class="array-slot" id="slot2"><div class="array-index">2</div></div>
            <div class="array-slot" id="slot3"><div class="array-index">3</div></div>
            <div class="array-slot" id="slot4"><div class="array-index">4</div></div>
            <div class="array-slot" id="slot5"><div class="array-index">5</div></div>
            <div class="array-slot" id="slot6"><div class="array-index">6</div></div> 
        </div>
    </div>

    <script>
        const animationSteps = [
            { id: 0, edge: null, text: "Root 'A' is mathematically guaranteed as the entry point.<br><span class='math-highlight'>Target Index: 0</span>" },
            { id: 1, edge: "e1", text: "Drop 'B' (Left Child of A) into the array.<br>Math: <span class='math-highlight'>2(0) + 1 = 1</span>" },
            { id: 2, edge: "e2", text: "'C' (Right Child of A) offsets to the adjacent slot.<br>Math: <span class='math-highlight'>2(0) + 2 = 2</span>" },
            { id: 3, edge: "e3", text: "Moving down a level! 'D' (Left Child of B: index 1).<br>Math: <span class='math-highlight'>2(1) + 1 = 3</span>" },
            { id: 4, edge: "e4", text: "'E' (Right Child of B: index 1).<br>Math: <span class='math-highlight'>2(1) + 2 = 4</span>" },
            { id: 5, edge: "e5", text: "'F' (Left Child of C: index 2). Skipping B's children.<br>Math: <span class='math-highlight'>2(2) + 1 = 5</span>" },
            { id: 6, edge: "e6", text: "'G' (Right Child of C: index 2). Level is now flat.<br>Math: <span class='math-highlight'>2(2) + 2 = 6</span>" }
        ];

        let isPaused = false;
        const delay = ms => new Promise(res => setTimeout(res, ms));

        function togglePause() {
            isPaused = !isPaused;
            const pauseBtn = document.getElementById('pause-btn');
            if (isPaused) {
                pauseBtn.innerText = "▶ Resume";
                pauseBtn.style.borderColor = "#ff9d00";
                pauseBtn.style.color = "#ff9d00";
            } else {
                pauseBtn.innerText = "⏸ Pause";
                pauseBtn.style.borderColor = "#00aa00";
                pauseBtn.style.color = "#39ff14";
            }
        }

        async function checkPause() {
            while (isPaused) {
                await delay(100);
            }
        }

        async function runAnimation() {
            const startBtn = document.getElementById('start-btn');
            const pauseBtn = document.getElementById('pause-btn');
            const caption = document.getElementById('caption');
            
            startBtn.style.display = 'none';
            pauseBtn.style.display = 'block';
            caption.style.display = 'block';

            for (let i = 0; i < animationSteps.length; i++) {
                await checkPause();
                
                const step = animationSteps[i];
                const node = document.getElementById('n' + step.id);
                const slot = document.getElementById('slot' + step.id);
                
                caption.innerHTML = step.text;
                node.classList.add('highlight');
                
                if (step.edge) {
                    const edgeLine = document.getElementById(step.edge);
                    edgeLine.classList.add('active-edge');
                    await delay(800); 
                    await checkPause();
                    edgeLine.style.opacity = '0'; 
                } else {
                    await delay(600); 
                }

                const nRect = node.getBoundingClientRect();
                const sRect = slot.getBoundingClientRect();
                
                const dx = sRect.left - nRect.left + (sRect.width - nRect.width) / 2;
                const dy = sRect.top - nRect.top + (sRect.height - nRect.height) / 2;

                node.style.transform = `translate(${dx}px, ${dy}px)`;

                await delay(1200); 
                await checkPause();

                node.classList.remove('highlight');
                node.classList.add('settled');
                slot.classList.add('filled');
                
                await delay(300);
            }

            pauseBtn.style.display = 'none';
            startBtn.style.display = 'block';
            startBtn.innerText = "↻ Replay";
            startBtn.onclick = () => location.reload();
            
            caption.innerHTML = "Array populated. 2D geometry perfectly mapped to 1D memory.<br><span class='math-highlight'>O(1) Access Achieved.</span>";
        }
    </script>
</body>
</html>
