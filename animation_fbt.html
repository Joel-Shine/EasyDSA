<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FBT Logic Animation</title>
    <style>
        body { background-color: #0a0a0a; color: #39ff14; font-family: 'Cascadia Code', Consolas, monospace; overflow: hidden; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .container { position: relative; width: 100%; max-width: 650px; height: 100%; min-height: 400px; }
        .header-panel { position: absolute; top: 15px; right: 15px; display: flex; gap: 10px; z-index: 20; }
        button { background: rgba(0, 0, 0, 0.8); color: #39ff14; border: 1px solid #00aa00; padding: 8px 16px; cursor: pointer; font-family: inherit; font-weight: bold; border-radius: 4px; transition: all 0.2s; }
        button:hover { background: #39ff14; color: #000; }
        .caption { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); font-size: 0.95rem; color: #e0e0e0; background: rgba(10, 10, 10, 0.95); padding: 12px 20px; border: 1px solid #003300; border-radius: 4px; border-top: 4px solid #39ff14; display: none; width: 90%; max-width: 500px; text-align: center; line-height: 1.5; box-shadow: 0 -4px 15px rgba(0,0,0,0.8); z-index: 20; }
        .math-highlight { color: #ff9d00; font-weight: bold; }
        .fbt-true { color: #00aa00; font-weight: bold; }
        .fbt-false { color: #ff3333; font-weight: bold; }
        
        svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        line { stroke: #005500; stroke-width: 3; }

        .node { position: absolute; width: 36px; height: 36px; border: 2px solid #005500; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; background: #000; z-index: 10; transition: all 0.3s; }
        .node.checking { border-color: #ff9d00; background: #221100; transform: scale(1.2); box-shadow: 0 0 15px rgba(255, 157, 0, 0.5); }
        .node.valid { border-color: #00aa00; color: #00aa00; }
        .node.invalid { border-color: #ff3333; color: #ff3333; background: #330000; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-panel">
            <button id="pause-btn" onclick="togglePause()" style="display: none;">⏸ Pause</button>
            <button id="start-btn" onclick="runAnimation()">▶ Start Check</button>
        </div>
        <div class="caption" id="caption"></div>
        
        <svg>
            <line x1="50%" y1="70" x2="35%" y2="150"/>
            <line x1="50%" y1="70" x2="65%" y2="150"/>
            <line x1="35%" y1="150" x2="25%" y2="230"/>
        </svg>

        <div class="node" id="n1" style="left: calc(50% - 20px); top: 50px;">1</div>
        <div class="node" id="n2" style="left: calc(35% - 20px); top: 130px;">2</div>
        <div class="node" id="n3" style="left: calc(65% - 20px); top: 130px;">3</div>
        <div class="node" id="n4" style="left: calc(25% - 20px); top: 210px;">4</div>
    </div>

    <script>
        const steps = [
            { id: 1, status: 'valid', text: "Checking Root (1): It has BOTH left and right children. Logic branches to check them." },
            { id: 3, status: 'valid', text: "Checking Node (3): It has ZERO children (<span class='math-highlight'>left==NULL && right==NULL</span>). Returns 1 (<span class='fbt-true'>TRUE</span>)." },
            { id: 2, status: 'invalid', text: "Checking Node (2): It has a left child (4), but NO right child. Returns 0 (<span class='fbt-false'>FALSE</span>)." },
            { id: 1, status: 'invalid', text: "Recursive collapse: (left_result && right_result). Since left returned FALSE, the entire tree is <span class='fbt-false'>NOT a Full Binary Tree</span>." }
        ];
        
        let isPaused = false;
        const delay = ms => new Promise(res => setTimeout(res, ms));

        function togglePause() {
            isPaused = !isPaused;
            const pauseBtn = document.getElementById('pause-btn');
            if (isPaused) {
                pauseBtn.innerText = "▶ Resume";
                pauseBtn.style.borderColor = "#ff9d00";
                pauseBtn.style.color = "#ff9d00";
            } else {
                pauseBtn.innerText = "⏸ Pause";
                pauseBtn.style.borderColor = "#00aa00";
                pauseBtn.style.color = "#39ff14";
            }
        }

        async function checkPause() { while (isPaused) await delay(100); }

        async function runAnimation() {
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('pause-btn').style.display = 'block';
            document.getElementById('caption').style.display = 'block';

            for (let i = 0; i < steps.length; i++) {
                await checkPause();
                const node = document.getElementById('n' + steps[i].id);
                document.getElementById('caption').innerHTML = steps[i].text;
                
                node.classList.add('checking');
                await delay(1200);
                await checkPause();
                
                node.classList.remove('checking');
                node.classList.add(steps[i].status);
                await delay(800);
            }
            document.getElementById('pause-btn').style.display = 'none';
            document.getElementById('start-btn').style.display = 'block';
            document.getElementById('start-btn').innerText = "↻ Replay";
            document.getElementById('start-btn').onclick = () => location.reload();
        }
    </script>
</body>
</html>
